plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "vulkiris"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vulkiris" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// ModMenu integration compiles against local stubs (src/client/java/com/terraformersmc),
	// which are excluded from the jar below — no remote ModMenu artifact needed to build.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"

	// The ModMenu API stubs are compile-time only; the real ModMenu provides them at runtime.
	exclude("com/terraformersmc/**")

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.named("sourcesJar", Jar).configure {
	archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
	exclude("com/terraformersmc/**")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
